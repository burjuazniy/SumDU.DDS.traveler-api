# Lab 7: what Prometheus scrapes inside the compose network.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: traveler-api          # RED metrics, DB pool, Node.js runtime
    static_configs:
      - targets: ['app:4567']
  - job_name: postgres              # PostgreSQL internals via postgres_exporter
    static_configs:
      - targets: ['postgres-exporter:9187']
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
