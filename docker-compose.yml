# Production-like stack: PostgreSQL primary + 2 replicas + TravelerAPI.
#   cp .env.example .env   # set real passwords
#   docker compose up --build -d
# Development overrides (live reload, source mounted): docker-compose.dev.yml
# Lab 4, step 2: PHYSICAL streaming replication, primary + 2 hot standby replicas (async).
name: travel_planner

x-postgres: &postgres-base
  image: postgres:18-alpine
  restart: unless-stopped
  networks: [backend]
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
    interval: 5s
    timeout: 5s
    retries: 10
    start_period: 20s
  deploy:
    resources:
      limits:
        cpus: "2.0"
        memory: 1G
  shm_size: 256m
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-postgres-env: &postgres-env
  POSTGRES_DB: ${DB_NAME:?set DB_NAME in .env}
  POSTGRES_USER: ${DB_USER:?set DB_USER in .env}
  POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
  POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
  # replication role: created by the init scripts from these variables (no secrets in SQL files)
  REPL_USER: ${REPL_USER:?set REPL_USER in .env}
  REPL_PASSWORD: ${REPL_PASSWORD:?set REPL_PASSWORD in .env}

services:
  # PostgreSQL 18 primary: schema from db/migrations, replication role + pg_hba rules from env
  postgres:
    <<: *postgres-base
    container_name: travel_planner_db
    environment: *postgres-env
    command: ["postgres", "-c", "wal_level=replica", "-c", "max_wal_senders=10", "-c", "max_replication_slots=10", "-c", "hot_standby=on", "-c", "wal_keep_size=256MB"]
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/migrations/001_create_tables.sql:/docker-entrypoint-initdb.d/001_create_tables.sql:ro
      - ./db/replication/physical/100_replication_role.sh:/docker-entrypoint-initdb.d/100_replication_role.sh:ro
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"

  # Hot standby 1: cloned from the primary with pg_basebackup on first start (own replication slot),
  # then streams WAL. Read-only; schema/DDL arrive with the WAL, nothing to apply by hand.
  postgres_replica_1:
    <<: *postgres-base
    container_name: travel_planner_replica_1
    user: postgres
    entrypoint: ["bash", "/replica-entrypoint.sh"]
    environment:
      <<: *postgres-env
      PRIMARY_HOST: postgres
      REPLICA_NAME: replica_1
    volumes:
      - pgdata_replica_1:/var/lib/postgresql
      - ./db/replication/physical/replica-entrypoint.sh:/replica-entrypoint.sh:ro
    ports:
      - "127.0.0.1:${REPLICA_PORT:-55432}:5432"
    depends_on:
      postgres: { condition: service_healthy }

  # Hot standby 2: same as replica 1 (bonus task "2 replicas")
  postgres_replica_2:
    <<: *postgres-base
    container_name: travel_planner_replica_2
    user: postgres
    entrypoint: ["bash", "/replica-entrypoint.sh"]
    environment:
      <<: *postgres-env
      PRIMARY_HOST: postgres
      REPLICA_NAME: replica_2
    volumes:
      - pgdata_replica_2:/var/lib/postgresql
      - ./db/replication/physical/replica-entrypoint.sh:/replica-entrypoint.sh:ro
    ports:
      - "127.0.0.1:${REPLICA2_PORT:-55433}:5432"
    depends_on:
      postgres: { condition: service_healthy }

  # TravelerAPI (Node.js), unprivileged user, read-only root filesystem; writes and reads go to the master
  app:
    build:
      context: .
      target: runtime
    image: traveler-api:latest
    container_name: travel_planner_api
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_POOL: ${DB_POOL:-20}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: 4567
    ports:
      - "127.0.0.1:${APP_PORT:-4567}:4567"
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend]
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  pgdata:
  pgdata_replica_1:
  pgdata_replica_2:

networks:
  backend:
    driver: bridge
