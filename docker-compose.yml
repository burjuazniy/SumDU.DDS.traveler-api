# Production-like stack: PostgreSQL primary + 2 replicas + TravelerAPI.
#   cp .env.example .env   # set real passwords
#   docker compose up --build -d
# Development overrides (live reload, source mounted): docker-compose.dev.yml
# Lab 4, step 4: primary + 2 synchronous (quorum ANY 1) hot standbys behind PgCat (read/write splitting).
name: travel_planner

x-postgres: &postgres-base
  image: postgres:18-alpine
  restart: unless-stopped
  networks: [backend]
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
    interval: 5s
    timeout: 5s
    retries: 10
    start_period: 20s
  deploy:
    resources:
      limits:
        cpus: "2.0"
        memory: 1G
  shm_size: 256m
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-postgres-env: &postgres-env
  POSTGRES_DB: ${DB_NAME:?set DB_NAME in .env}
  POSTGRES_USER: ${DB_USER:?set DB_USER in .env}
  POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
  POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
  # replication role: created by the init scripts from these variables (no secrets in SQL files)
  REPL_USER: ${REPL_USER:?set REPL_USER in .env}
  REPL_PASSWORD: ${REPL_PASSWORD:?set REPL_PASSWORD in .env}

services:
  # PostgreSQL 18 primary: schema from db/migrations, replication role + pg_hba rules from env
  postgres:
    <<: *postgres-base
    container_name: travel_planner_db
    environment:
      <<: *postgres-env
      # quorum: COMMIT waits for WAL on any 1 of the 2 standbys (RPO 0, survives the loss of one replica)
      SYNC_STANDBYS: ${SYNC_STANDBYS-ANY 1 (replica_1, replica_2)}
    command: ["postgres", "-c", "wal_level=replica", "-c", "max_wal_senders=10", "-c", "max_replication_slots=10", "-c", "hot_standby=on", "-c", "wal_keep_size=256MB"]
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/migrations/001_create_tables.sql:/docker-entrypoint-initdb.d/001_create_tables.sql:ro
      - ./db/replication/physical/100_replication_role.sh:/docker-entrypoint-initdb.d/100_replication_role.sh:ro
      - ./db/replication/physical/200_synchronous.sh:/docker-entrypoint-initdb.d/200_synchronous.sh:ro
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"

  # Hot standby 1: cloned from the primary with pg_basebackup on first start (own replication slot),
  # then streams WAL. Read-only; schema/DDL arrive with the WAL, nothing to apply by hand.
  postgres_replica_1:
    <<: *postgres-base
    container_name: travel_planner_replica_1
    user: postgres
    entrypoint: ["bash", "/replica-entrypoint.sh"]
    environment:
      <<: *postgres-env
      PRIMARY_HOST: postgres
      REPLICA_NAME: replica_1
    volumes:
      - pgdata_replica_1:/var/lib/postgresql
      - ./db/replication/physical/replica-entrypoint.sh:/replica-entrypoint.sh:ro
    ports:
      - "127.0.0.1:${REPLICA_PORT:-55432}:5432"
    depends_on:
      postgres: { condition: service_healthy }

  # Hot standby 2: same as replica 1 (bonus task "2 replicas")
  postgres_replica_2:
    <<: *postgres-base
    container_name: travel_planner_replica_2
    user: postgres
    entrypoint: ["bash", "/replica-entrypoint.sh"]
    environment:
      <<: *postgres-env
      PRIMARY_HOST: postgres
      REPLICA_NAME: replica_2
    volumes:
      - pgdata_replica_2:/var/lib/postgresql
      - ./db/replication/physical/replica-entrypoint.sh:/replica-entrypoint.sh:ro
    ports:
      - "127.0.0.1:${REPLICA2_PORT:-55433}:5432"
    depends_on:
      postgres: { condition: service_healthy }

  # PgCat: pooler/router in front of the cluster; the application connects only to it
  pgcat:
    image: ghcr.io/postgresml/pgcat@sha256:627761f6dcbc8c0d17809445d7441518e2452c6d4fbdcc2a9986871d9e3e1176  # 1.2.0
    container_name: travel_planner_pgcat
    restart: unless-stopped
    entrypoint: ["sh", "-c"]
    command:
      - >-
        sed -e "s|__DB_NAME__|$DB_NAME|g" -e "s|__DB_USER__|$DB_USER|g"
        -e "s|__DB_PASSWORD__|$DB_PASSWORD|g" -e "s|__PGCAT_ADMIN_PASSWORD__|$PGCAT_ADMIN_PASSWORD|g"
        /etc/pgcat/pgcat.toml.tmpl > /tmp/pgcat.toml && exec pgcat /tmp/pgcat.toml
    environment:
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      PGCAT_ADMIN_PASSWORD: ${PGCAT_ADMIN_PASSWORD:?set PGCAT_ADMIN_PASSWORD in .env}
      RUST_LOG: warn
    volumes:
      - ./pgcat/pgcat.toml.tmpl:/etc/pgcat/pgcat.toml.tmpl:ro
    depends_on:
      postgres: { condition: service_healthy }
      postgres_replica_1: { condition: service_healthy }
      postgres_replica_2: { condition: service_healthy }
    networks: [backend]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M

  # TravelerAPI (Node.js), unprivileged user, read-only root filesystem; all queries go through PgCat
  app:
    build:
      context: .
      target: runtime
    image: traveler-api:latest
    container_name: travel_planner_api
    restart: unless-stopped
    environment:
      DB_HOST: pgcat
      DB_PORT: 6432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_POOL: ${DB_POOL:-20}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: 4567
    ports:
      - "127.0.0.1:${APP_PORT:-4567}:4567"
    depends_on:
      - pgcat
    networks: [backend]
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  pgdata:
  pgdata_replica_1:
  pgdata_replica_2:

networks:
  backend:
    driver: bridge
